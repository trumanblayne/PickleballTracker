<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect } = React;

const PLACEMENTS = [
  { id: "crosscourt", label: "Crosscourt" },
  { id: "down_line", label: "Down the line" },
  { id: "middle", label: "Middle" },
];

const POINT_CAUSES = [
  { id: "winner", label: "Winner (general)" },
  { id: "ace", label: "Ace", servingOnly: true, detailOptions: PLACEMENTS.filter((p) => p.id !== "crosscourt") },
  { id: "smash", label: "Smash", noDetail: true },
  { id: "dropshot", label: "Drop-shot" },
  { id: "passing", label: "Passing shot", singlesOnly: true },
  { id: "unforced_opp_error", label: "Unforced opponent error", doublesOnly: true, opponentCaused: true },
  { id: "opp_missed_serve", label: "Opponent missed serve", receivingOnly: true, opponentCaused: true },
  { id: "forced_error", label: "Forced opponent error", opponentCaused: true },
];

const ERROR_CAUSES = [
  {
    id: "missed_serve", label: "Missed serve", alwaysUnforced: true, servingOnly: true,
    detailQuestion: "Into the net or out?",
    detailOptions: [{ id: "net", label: "Into the net" }, { id: "out", label: "Out" }],
  },
  { id: "net", label: "Into the net" },
  { id: "out", label: "Out (long/wide)" },
  { id: "drop_high", label: "Drop shot too high" },
  { id: "dink_error", label: "Dink error (net or out)" },
  { id: "volley_err", label: "Volley error" },
  { id: "missed_ball", label: "Missed ball / swing and miss" },
  { id: "lob_out", label: "Lob that sails out" },
];

const COLORS = {
  court: "#1F4D33", ball: "#E4F04A", point: "#2F9E44", pointDark: "#1F7A34",
  error: "#DD3C3C", errorDark: "#AF2C2C", bg: "#F5F3EC", ink: "#152226",
  line: "#E1DDD0",
};

const SCORE_OPTIONS = Array.from({ length: 31 }, (_, i) => i);
const STORAGE_KEY = "pb_tracker_state_v1";

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) { return null; }
}
function fmtTime(ts) {
  return new Date(ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
}
function fmtDate(ts) {
  return new Date(ts).toLocaleDateString([], { month: "short", day: "numeric", year: "numeric" });
}
function playerLabel(p, names) {
  const n = names || {};
  if (p === "me") return (n.you && n.you.trim()) || "Me";
  if (p === "partner") return (n.partner && n.partner.trim()) || "Partner";
  if (p === "opp1") return (n.opp1 && n.opp1.trim()) || "Opponent 1";
  if (p === "opp2") return (n.opp2 && n.opp2.trim()) || "Opponent 2";
  return "";
}
function matchupSubtitle(format, names) {
  const you = (names.you && names.you.trim()) || "You";
  if (format === "doubles") {
    const partner = (names.partner && names.partner.trim()) || "Partner";
    const opp1 = (names.opp1 && names.opp1.trim()) || "Opponent 1";
    const opp2 = (names.opp2 && names.opp2.trim()) || "Opponent 2";
    return you + " & " + partner + " vs " + opp1 + " & " + opp2;
  }
  const opp = (names.opp1 && names.opp1.trim()) || "Opponent";
  return you + " vs " + opp;
}
function opponentKey(m) {
  const norm = (s) => (s || "").trim().toLowerCase();
  if (m.format === "doubles") {
    const pair = [norm(m.names?.opp1), norm(m.names?.opp2)].sort().join(" & ");
    return pair.trim() || "unnamed doubles opponents";
  }
  return norm(m.names?.opp1) || "unnamed opponent";
}
function opponentDisplayName(m) {
  if (m.format === "doubles") {
    const a = (m.names?.opp1 || "").trim() || "Opponent 1";
    const b = (m.names?.opp2 || "").trim() || "Opponent 2";
    return a + " & " + b;
  }
  return (m.names?.opp1 || "").trim() || "Opponent";
}
function matchResult(m) {
  if (!m.gamesWon) return "incomplete";
  if (m.gamesWon.you > m.gamesWon.opp) return "win";
  if (m.gamesWon.opp > m.gamesWon.you) return "loss";
  return "incomplete";
}
function csvEscape(val) {
  const s = String(val === undefined || val === null ? "" : val);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function exportLogAsCSV(entries, names) {
  const header = ["date","time","game","type","cause","forced_or_unforced","player","placement","format","server_at_time","server_number_at_time","side_out","your_score_after","opponent_score_after"];
  const chronological = entries.slice().reverse();
  const rows = chronological.map((e) => {
    const d = new Date(e.time);
    return [
      d.toLocaleDateString(), d.toLocaleTimeString(), e.gameNumber || 1, e.type, e.cause,
      e.forced === true ? "forced" : e.forced === false ? "unforced" : "",
      playerLabel(e.player, names), e.placement || "",
      e.format || "singles", e.serverAtTime, e.serverNumberAtTime || "",
      e.sideOut ? "yes" : "no", e.scoreAfter.you, e.scoreAfter.opp,
    ];
  });
  const csv = [header].concat(rows).map((r) => r.map(csvEscape).join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-");
  a.href = url;
  a.download = "pickleball-log-" + stamp + ".csv";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function replay(chronoEntries, startServer, startServerNumber) {
  let score = { you: 0, opp: 0 };
  let server = startServer;
  let serverNumber = startServerNumber;
  const rebuilt = [];
  for (const e of chronoEntries) {
    let newScore = { ...score }, newServer = server, newServerNumber = serverNumber, sideOut = false;
    if (e.format === "doubles") {
      const servingTeamWon = (server === "you" && e.type === "point") || (server === "opp" && e.type === "error");
      if (servingTeamWon) newScore[server] += 1;
      else if (serverNumber === 1) newServerNumber = 2;
      else { newServer = server === "you" ? "opp" : "you"; newServerNumber = 1; sideOut = true; }
    } else {
      if (server === "you") { if (e.type === "point") newScore.you += 1; else { newServer = "opp"; sideOut = true; } }
      else { if (e.type === "point") { newServer = "you"; sideOut = true; } else newScore.opp += 1; }
    }
    rebuilt.push({
      ...e, serverAtTime: server, serverNumberAtTime: e.format === "doubles" ? serverNumber : null,
      sideOut, scoreAfter: newScore, serverAfter: newServer, serverNumberAfter: e.format === "doubles" ? newServerNumber : null,
    });
    score = newScore; server = newServer; serverNumber = newServerNumber;
  }
  return { rebuiltLog: rebuilt, finalScore: score, finalServer: server, finalServerNumber: serverNumber };
}

function computeStats(entries) {
  const points = entries.filter((e) => e.type === "point");
  const errors = entries.filter((e) => e.type === "error");
  const forcedErr = errors.filter((e) => e.forced === true).length;
  const unforcedErr = errors.filter((e) => e.forced === false).length;
  const tally = (arr) => {
    const map = {};
    arr.forEach((e) => { map[e.cause] = (map[e.cause] || 0) + 1; });
    return Object.entries(map).sort((a, b) => b[1] - a[1]);
  };
  const byPlayer = { me: { points: 0, errors: 0 }, partner: { points: 0, errors: 0 } };
  const byOpponent = { opp1: 0, opp2: 0 };
  entries.forEach((e) => {
    if (e.player === "me" || e.player === "partner") byPlayer[e.player][e.type === "point" ? "points" : "errors"] += 1;
    else if (e.player === "opp1" || e.player === "opp2") byOpponent[e.player] += 1;
  });
  const hasPlayerData = entries.some((e) => e.player === "me" || e.player === "partner");
  const hasOpponentData = entries.some((e) => e.player === "opp1" || e.player === "opp2");
  return { points, errors, forcedErr, unforcedErr, pointTally: tally(points), errorTally: tally(errors), total: points.length + errors.length, byPlayer, byOpponent, hasPlayerData, hasOpponentData };
}
function pointWinRatePct(entries) {
  const s = computeStats(entries);
  return s.total ? Math.round((s.points.length / s.total) * 100) : null;
}

function App() {
  const saved = loadState();
  const [format, setFormat] = useState(saved?.format || "singles");
  const [names, setNames] = useState(saved?.names || { you: "", partner: "", opp1: "", opp2: "" });
  const [bestOf, setBestOf] = useState(saved?.bestOf || 1);
  const [targetScore, setTargetScore] = useState(saved?.targetScore || 11);
  const [scoringDetail, setScoringDetail] = useState(saved?.scoringDetail || "basic");
  const [matchPhase, setMatchPhase] = useState(saved && saved.matchPhase === "playing" ? "playing" : "names");

  const [score, setScore] = useState(saved?.score || { you: 0, opp: 0 });
  const [server, setServer] = useState(saved?.server || "you");
  const [serverNumber, setServerNumber] = useState(saved?.serverNumber || 2);
  const [currentLog, setCurrentLog] = useState(saved?.currentLog || []);
  const [completedGames, setCompletedGames] = useState(saved?.completedGames || []);
  const [gamesWon, setGamesWon] = useState(saved?.gamesWon || { you: 0, opp: 0 });
  const [lastGameResult, setLastGameResult] = useState(null);

  const [stage, setStage] = useState("select");
  const [forced, setForced] = useState(null);
  const [view, setView] = useState("track");
  const [confirmReset, setConfirmReset] = useState(false);
  const [confirmUndo, setConfirmUndo] = useState(false);
  const [showScoreEdit, setShowScoreEdit] = useState(false);
  const [matches, setMatches] = useState(saved?.matches || []);
  const [selectedMatchId, setSelectedMatchId] = useState(null);
  const [groupBy, setGroupBy] = useState("recent");
  const [selectedOpponentKey, setSelectedOpponentKey] = useState(null);
  const [askGameOver, setAskGameOver] = useState(false);

  const gamesToWin = Math.ceil(bestOf / 2);

  useEffect(() => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      format, names, bestOf, targetScore, scoringDetail, matchPhase,
      score, server, serverNumber, currentLog, completedGames, gamesWon, matches,
    }));
  }, [format, names, bestOf, targetScore, scoringDetail, matchPhase, score, server, serverNumber, currentLog, completedGames, gamesWon, matches]);

  function commit(type, causeLabel, player, detail) {
    let newScore = { ...score }, newServer = server, newServerNumber = serverNumber, sideOut = false;
    if (format === "doubles") {
      const servingTeamWon = (server === "you" && type === "point") || (server === "opp" && type === "error");
      if (servingTeamWon) newScore[server] += 1;
      else if (serverNumber === 1) newServerNumber = 2;
      else { newServer = server === "you" ? "opp" : "you"; newServerNumber = 1; sideOut = true; }
    } else {
      if (server === "you") { if (type === "point") newScore.you += 1; else { newServer = "opp"; sideOut = true; } }
      else { if (type === "point") { newServer = "you"; sideOut = true; } else newScore.opp += 1; }
    }

    const entry = {
      id: Date.now() + "-" + Math.random(),
      type, cause: causeLabel,
      forced: type === "error" ? forced : null,
      player: player || null,
      placement: detail?.placement || null,
      gameNumber: completedGames.length + 1,
      format,
      serverAtTime: server, serverNumberAtTime: format === "doubles" ? serverNumber : null,
      sideOut, scoreAfter: newScore, serverAfter: newServer,
      serverNumberAfter: format === "doubles" ? newServerNumber : null,
      time: Date.now(),
    };

    setCurrentLog((l) => [entry, ...l]);
    setScore(newScore);
    setServer(newServer);
    setServerNumber(newServerNumber);
    setForced(null);
    setStage("select");

    // Manual checkpoint: as soon as either side reaches the target score,
    // ask — don't force it. "No" just dismisses; it'll ask again next point
    // if the score still qualifies.
    if (newScore.you >= targetScore || newScore.opp >= targetScore) {
      setAskGameOver(true);
    }
  }

  // Called when the person answers "Yes" to the game-over prompt.
  function finishCurrentGame() {
    const winner = score.you > score.opp ? "you" : score.opp > score.you ? "opp" : "you";
    const finishedGame = { gameNumber: completedGames.length + 1, log: currentLog.slice(), finalScore: { ...score }, winner };
    const newGamesWon = { ...gamesWon, [winner]: gamesWon[winner] + 1 };
    setCompletedGames((g) => [finishedGame, ...g]);
    setGamesWon(newGamesWon);
    setLastGameResult(finishedGame);
    setCurrentLog([]);
    setScore({ you: 0, opp: 0 });
    setServer(winner === "you" ? "opp" : "you");
    setServerNumber(2);
    setForced(null);
    setStage("select");
    setAskGameOver(false);
    setMatchPhase(newGamesWon[winner] >= gamesToWin ? "match_over" : "game_over");
  }

  function removeEntry(id) {
    if (!currentLog.some((e) => e.id === id)) return;
    const priorBase = currentLog.length ? currentLog[0].scoreAfter : { you: 0, opp: 0 };
    const manualDelta = { you: score.you - priorBase.you, opp: score.opp - priorBase.opp };
    const chronological = currentLog.slice().reverse().filter((e) => e.id !== id);
    const startServer = completedGames.length ? (completedGames[0].winner === "you" ? "opp" : "you") : "you";
    const { rebuiltLog, finalScore, finalServer, finalServerNumber } = replay(chronological, startServer, 2);
    setCurrentLog(rebuiltLog.slice().reverse());
    setScore({ you: finalScore.you + manualDelta.you, opp: finalScore.opp + manualDelta.opp });
    setServer(finalServer);
    setServerNumber(finalServerNumber);
    setConfirmUndo(false);
  }

  function undo() {
    if (currentLog.length === 0) return;
    removeEntry(currentLog[0].id);
  }

  function buildMatchRecord(completed) {
    const games = currentLog.length
      ? [{ gameNumber: completedGames.length + 1, log: currentLog.slice(), finalScore: { ...score }, winner: null }, ...completedGames]
      : completedGames;
    return {
      id: Date.now() + "-" + Math.random(),
      savedAt: Date.now(),
      format, names: { ...names }, bestOf, targetScore, scoringDetail,
      gamesWon: { ...gamesWon }, games, completed,
    };
  }

  function saveMatchAndRestart() {
    if (completedGames.length > 0 || currentLog.length > 0) {
      setMatches((m) => [buildMatchRecord(gamesWon.you >= gamesToWin || gamesWon.opp >= gamesToWin), ...m]);
    }
    resetMatchState();
    setMatchPhase("names");
  }

  function startRematch(matchRecord) {
    setFormat(matchRecord.format);
    setNames({ ...matchRecord.names });
    setBestOf(matchRecord.bestOf);
    setTargetScore(matchRecord.targetScore);
    setScoringDetail(matchRecord.scoringDetail || "basic");
    resetMatchState();
    setSelectedMatchId(null);
    setSelectedOpponentKey(null);
    setMatchPhase("names");
  }

  function resetMatchState() {
    setScore({ you: 0, opp: 0 });
    setServer("you");
    setServerNumber(2);
    setCurrentLog([]);
    setCompletedGames([]);
    setGamesWon({ you: 0, opp: 0 });
    setLastGameResult(null);
    setStage("select");
    setForced(null);
    setConfirmReset(false);
    setView("track");
  }

  function startNextGame() {
    setMatchPhase("playing");
    setView("track");
  }

  function deleteMatch(id) {
    setMatches((m) => m.filter((x) => x.id !== id));
    if (selectedMatchId === id) setSelectedMatchId(null);
  }

  const fullMatchLogSoFar = useMemo(() => currentLog.concat(completedGames.flatMap((g) => g.log)), [currentLog, completedGames]);
  const stats = useMemo(() => computeStats(fullMatchLogSoFar), [fullMatchLogSoFar]);
  const currentLogIds = useMemo(() => new Set(currentLog.map((e) => e.id)), [currentLog]);

  if (matchPhase === "names") {
    return (
      <NamesScreen
        format={format} setFormat={setFormat} names={names} setNames={setNames}
        bestOf={bestOf} setBestOf={setBestOf} targetScore={targetScore} setTargetScore={setTargetScore}
        scoringDetail={scoringDetail} setScoringDetail={setScoringDetail}
        onStart={() => { resetMatchState(); setMatchPhase("playing"); }}
      />
    );
  }
  if (matchPhase === "game_over" && lastGameResult) {
    return <GameOverScreen result={lastGameResult} gamesWon={gamesWon} bestOf={bestOf} names={names} onContinue={startNextGame} />;
  }
  if (matchPhase === "match_over") {
    return (
      <MatchOverScreen
        gamesWon={gamesWon} bestOf={bestOf} names={names}
        games={lastGameResult ? [lastGameResult, ...completedGames.filter((g) => g !== lastGameResult)] : completedGames}
        onSave={saveMatchAndRestart}
      />
    );
  }

  return (
    <div style={{ minHeight: "100vh", width: "100%", display: "flex", flexDirection: "column", background: COLORS.bg, color: COLORS.ink }}>
      <Scoreboard
        score={score} server={server} serverNumber={serverNumber} format={format} names={names}
        gamesWon={gamesWon} bestOf={bestOf} gameNumber={completedGames.length + 1} targetScore={targetScore}
        onToggleServer={() => setServer((s) => (s === "you" ? "opp" : "you"))}
        onToggleServerNumber={() => setServerNumber((n) => (n === 1 ? 2 : 1))}
        showScoreEdit={showScoreEdit} setShowScoreEdit={setShowScoreEdit}
        onScoreChange={(side, val) => setScore((s) => ({ ...s, [side]: val }))}
      />
      <div style={{ flex: 1, padding: "16px 16px 100px", maxWidth: 480, margin: "0 auto", width: "100%" }}>
        {view === "track" && (
          <TrackView stage={stage} setStage={setStage} forced={forced} setForced={setForced} commit={commit} format={format} server={server} names={names} scoringDetail={scoringDetail} />
        )}
        {view === "log" && <LogView entries={fullMatchLogSoFar} names={names} onDeleteEntry={removeEntry} deletableIds={currentLogIds} />}
        {view === "log" && fullMatchLogSoFar.length > 0 && (
          <button onClick={() => exportLogAsCSV(fullMatchLogSoFar, names)} style={{
            position: "fixed", bottom: 96, right: 16, display: "flex", alignItems: "center", gap: 8,
            borderRadius: 999, padding: "12px 18px", fontSize: 14, fontWeight: 700, color: "white",
            background: COLORS.court, boxShadow: "0 2px 8px rgba(0,0,0,0.2)",
          }}>⬇ Export CSV</button>
        )}
        {view === "stats" && <StatsView stats={stats} names={names} />}
        {view === "matches" && (
          <MatchesView matches={matches} selectedMatchId={selectedMatchId} setSelectedMatchId={setSelectedMatchId}
            onDeleteMatch={deleteMatch} groupBy={groupBy} setGroupBy={setGroupBy}
            selectedOpponentKey={selectedOpponentKey} setSelectedOpponentKey={setSelectedOpponentKey}
            onRematch={startRematch} />
        )}
      </div>
      {askGameOver && (
        <GameOverPrompt score={score} targetScore={targetScore} onYes={finishCurrentGame} onNo={() => setAskGameOver(false)} />
      )}
      <BottomBar view={view} setView={setView} onUndo={undo} canUndo={currentLog.length > 0}
        confirmUndo={confirmUndo} setConfirmUndo={setConfirmUndo} lastEventLabel={currentLog[0] ? currentLog[0].cause : ""}
        confirmReset={confirmReset} setConfirmReset={setConfirmReset} onReset={saveMatchAndRestart}
        hasActiveMatch={currentLog.length > 0 || completedGames.length > 0} />
    </div>
  );
}

      <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
        {serving && <span style={{ width: 8, height: 8, borderRadius: "50%", background: COLORS.ball, display: "inline-block" }} />}
        <span style={{ fontSize: 12, fontWeight: 700, letterSpacing: "0.05em", textTransform: "uppercase", color: "#CFE3D6" }}>{label}</span>
      </div>
      <span style={{ fontSize: 48, fontWeight: 900, lineHeight: 1, fontVariantNumeric: "tabular-nums", color: "white" }}>{value}</span>
    </button>
  );
}

function TrackView({ stage, setStage, forced, setForced, commit, format, server, names, scoringDetail }) {
  const [draft, setDraft] = useState(null);
  const [subStage, setSubStage] = useState(null);

  useEffect(() => {
    if (stage === "select") { setDraft(null); setSubStage(null); }
  }, [stage]);

  function chooseCause(type, causeItem) {
    const d = {
      type, causeLabel: causeItem.label, opponentCaused: !!causeItem.opponentCaused, player: null,
      detailQuestion: causeItem.detailQuestion || null, detailOptions: causeItem.detailOptions || null,
      noDetail: !!causeItem.noDetail,
    };
    if (format === "doubles") { setDraft(d); setSubStage("who"); }
    else if (scoringDetail === "detailed" && !d.noDetail) { setDraft(d); setSubStage("detail"); }
    else { commit(type, causeItem.label, null, null); }
  }
  function afterWho(player) {
    const d = { ...draft, player };
    if (scoringDetail === "detailed" && !d.noDetail) { setDraft(d); setSubStage("detail"); }
    else { commit(d.type, d.causeLabel, player, null); setDraft(null); setSubStage(null); }
  }
  function finishWithDetail(detail) {
    commit(draft.type, draft.causeLabel, draft.player, detail);
    setDraft(null); setSubStage(null);
  }

  if (subStage === "who" && draft) {
    const accent = draft.type === "point" ? COLORS.point : COLORS.error;
    const labels = draft.opponentCaused
      ? [playerLabel("opp1", names), "opp1", playerLabel("opp2", names), "opp2"]
      : [playerLabel("me", names), "me", playerLabel("partner", names), "partner"];
    const [labelA, valueA, labelB, valueB] = labels;
    return (
      <Panel title="Who?" onBack={() => { setDraft(null); setSubStage(null); }} accent={accent}>
        <div style={{ fontSize: 14, marginBottom: 16, opacity: 0.7 }}>{draft.causeLabel}</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          <CauseButton label={labelA} accent={accent} onClick={() => afterWho(valueA)} />
          <CauseButton label={labelB} accent={accent} onClick={() => afterWho(valueB)} />
        </div>
      </Panel>
    );
  }
  if (subStage === "detail" && draft) {
    const accent = draft.type === "point" ? COLORS.point : COLORS.error;
    return <DetailStep draft={draft} accent={accent} onBack={() => setSubStage(format === "doubles" ? "who" : null)} onSubmit={finishWithDetail} />;
  }
  if (stage === "select") {
    return (
      <div style={{ display: "flex", flexDirection: "column", gap: 16, marginTop: 8 }}>
        <BigChoice bg={COLORS.point} label="POINT" sub="You won the rally" onClick={() => setStage("point_cause")} />
        <BigChoice bg={COLORS.error} label="ERROR" sub="You lost the rally" onClick={() => { setForced(false); setStage("error_cause"); }} />
      </div>
    );
  }
  if (stage === "point_cause") {
    const items = POINT_CAUSES.filter((c) =>
      !(c.servingOnly && server !== "you") && !(c.receivingOnly && server !== "opp") &&
      !(c.singlesOnly && format === "doubles") && !(c.doublesOnly && format !== "doubles")
    );
    return (
      <Panel title="How'd you win it?" onBack={() => setStage("select")} accent={COLORS.point}>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
          {items.map((c) => (<CauseButton key={c.id} label={c.label} accent={COLORS.point} onClick={() => chooseCause("point", c)} />))}
        </div>
      </Panel>
    );
  }
  if (stage === "error_cause") {
    const items = ERROR_CAUSES.filter((item) => !(forced && item.alwaysUnforced) && !(item.servingOnly && server !== "you"));
    return (
      <Panel title="What kind of error?" onBack={() => setStage("select")} accent={COLORS.error}>
        <div style={{ display: "flex", borderRadius: 999, padding: 4, marginBottom: 20, background: COLORS.error + "1A" }}>
          <ForcedToggle label="Unforced" active={forced === false} onClick={() => setForced(false)} />
          <ForcedToggle label="Forced" active={forced === true} onClick={() => setForced(true)} />
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
          {items.map((item) => (<CauseButton key={item.id} label={item.label} accent={COLORS.error} onClick={() => chooseCause("error", item)} />))}
        </div>
      </Panel>
    );
  }
  return null;
}

function DetailStep({ draft, accent, onBack, onSubmit }) {
  const question = draft.detailQuestion || "Placement";
  const options = draft.detailOptions || PLACEMENTS;
  return (
    <Panel title="Add detail (optional)" onBack={onBack} accent={accent}>
      <div style={{ fontSize: 14, marginBottom: 16, opacity: 0.7 }}>{draft.causeLabel}</div>

              <div style={{ width: (stats.unforcedErr / errTotal) * 100 + "%", background: COLORS.ball }} />

function TrendChart({ points, color }) {
  if (points.length < 2) return <div style={{ fontSize: 12, opacity: 0.5, textAlign: "center", padding: "24px 0" }}>Not enough matches yet for a trend line.</div>;
  const width = 300, height = 120, pad = 22;
  const ys = points.map((p) => p.y);
  const minY = Math.min.apply(null, ys.concat([0]));
  const maxY = Math.max.apply(null, ys.concat([100]));
  const stepX = (width - pad * 2) / (points.length - 1);
  const scaleY = (y) => height - pad - ((y - minY) / ((maxY - minY) || 1)) * (height - pad * 2);
  const coords = points.map((p, i) => [pad + i * stepX, scaleY(p.y)]);
  return (
    <div>
      <svg viewBox={"0 0 " + width + " " + height} style={{ width: "100%", height: 120 }}>
        <polyline points={coords.map((c) => c.join(",")).join(" ")} fill="none" stroke={color} strokeWidth="2" />
        {coords.map((c, i) => <circle key={i} cx={c[0]} cy={c[1]} r="3" fill={color} />)}
      </svg>
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, opacity: 0.5, marginTop: 4 }}>
        <span>{points[0].x}</span>
        <span>{points[points.length - 1].x}</span>
      </div>
    </div>
  );
}

function MatchesView({ matches, selectedMatchId, setSelectedMatchId, onDeleteMatch, groupBy, setGroupBy, selectedOpponentKey, setSelectedOpponentKey, onRematch }) {
  const selected = matches.find((m) => m.id === selectedMatchId);

  if (selected) {
    const allEvents = selected.games.flatMap((g) => g.log);
    const matchStats = computeStats(allEvents);
    const sortedGames = selected.games.slice().sort((a, b) => a.gameNumber - b.gameNumber);
    return (
      <div>
        <button onClick={() => setSelectedMatchId(null)} style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 14, fontWeight: 700, marginBottom: 16, color: COLORS.court }}>← All matches</button>
        <div style={{ borderRadius: 14, background: "white", border: "1px solid " + COLORS.line, padding: 16, marginBottom: 20 }}>
          <div style={{ fontSize: 11, fontWeight: 700, textTransform: "uppercase", opacity: 0.6, marginBottom: 4 }}>
            {fmtDate(selected.savedAt)} · {selected.format === "doubles" ? "Doubles" : "Singles"} · vs {opponentDisplayName(selected)}
          </div>
          <div style={{ fontSize: 32, fontWeight: 900, marginBottom: 4 }}>{selected.gamesWon.you}–{selected.gamesWon.opp} games</div>
          <div style={{ fontSize: 12, opacity: 0.6, marginBottom: 12 }}>{sortedGames.map((g) => "G" + g.gameNumber + ": " + g.finalScore.you + "-" + g.finalScore.opp).join("  ·  ")}</div>
          <button onClick={() => onRematch(selected)} style={{ borderRadius: 999, padding: "8px 16px", fontSize: 12, fontWeight: 700, color: "white", background: COLORS.court }}>
            Play these opponents again
          </button>
        </div>
        <div style={{ marginBottom: 24 }}><StatsView stats={matchStats} names={selected.names} /></div>
        <SectionLabel>Full log</SectionLabel>
        <LogView entries={allEvents} names={selected.names} />
      </div>
    );
  }

  if (groupBy === "opponent" && selectedOpponentKey) {
    const group = matches.filter((m) => opponentKey(m) === selectedOpponentKey);
    const allEvents = group.flatMap((m) => m.games.flatMap((g) => g.log));
    const groupStats = computeStats(allEvents);
    const wins = group.filter((m) => matchResult(m) === "win").length;
    const losses = group.filter((m) => matchResult(m) === "loss").length;
    const trend = group.slice().sort((a, b) => a.savedAt - b.savedAt)
      .map((m) => ({ x: fmtDate(m.savedAt), y: pointWinRatePct(m.games.flatMap((g) => g.log)) }))
      .filter((p) => p.y !== null);
    return (
      <div>
        <button onClick={() => setSelectedOpponentKey(null)} style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 14, fontWeight: 700, marginBottom: 16, color: COLORS.court }}>← All opponents</button>
        <div style={{ borderRadius: 14, background: "white", border: "1px solid " + COLORS.line, padding: 16, marginBottom: 20 }}>
          <div style={{ fontSize: 11, fontWeight: 700, textTransform: "uppercase", opacity: 0.6, marginBottom: 4 }}>vs {opponentDisplayName(group[0])}</div>
          <div style={{ fontSize: 22, fontWeight: 900, marginBottom: 4 }}>{wins}–{losses} <span style={{ fontSize: 13, fontWeight: 500, opacity: 0.6 }}>matches</span></div>
          <div style={{ fontSize: 12, opacity: 0.6, marginBottom: 12 }}>{group.length} match{group.length === 1 ? "" : "es"} played</div>
          <button onClick={() => onRematch(group[0])} style={{ borderRadius: 999, padding: "8px 16px", fontSize: 12, fontWeight: 700, color: "white", background: COLORS.court }}>
            Play these opponents again
          </button>
        </div>
        <div style={{ marginBottom: 24 }}>
          <SectionLabel>Point win % trend</SectionLabel>
          <div style={{ borderRadius: 14, background: "white", border: "1px solid " + COLORS.line, padding: 12 }}>
            <TrendChart points={trend} color={COLORS.point} />
          </div>
        </div>
        <StatsView stats={groupStats} names={group[0].names} />
      </div>
    );
  }

  if (groupBy === "opponent") {
    const groups = {};
    matches.forEach((m) => {
      const key = opponentKey(m);
      if (!groups[key]) groups[key] = [];
      groups[key].push(m);
    });
    const groupList = Object.entries(groups);
    return (
      <div>
        <GroupByToggle groupBy={groupBy} setGroupBy={setGroupBy} />
        {groupList.length === 0 ? (
          <EmptyState text="No saved matches yet." />
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 8, marginTop: 8 }}>
            {groupList.map(([key, group]) => {
              const wins = group.filter((m) => matchResult(m) === "win").length;
              const losses = group.filter((m) => matchResult(m) === "loss").length;
              return (
                <button key={key} onClick={() => setSelectedOpponentKey(key)} style={{ borderRadius: 14, background: "white", border: "1px solid " + COLORS.line, padding: 12, textAlign: "left", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                  <div>
                    <div style={{ fontSize: 14, fontWeight: 600 }}>vs {opponentDisplayName(group[0])}</div>
                    <div style={{ fontSize: 12, opacity: 0.6, marginTop: 2 }}>{group.length} match{group.length === 1 ? "" : "es"} · {wins}-{losses} record</div>
                  </div>
                  <span style={{ opacity: 0.4 }}>👥</span>
                </button>
              );
            })}
          </div>
        )}
      </div>
    );
  }

  const trend = matches.slice().sort((a, b) => a.savedAt - b.savedAt)
    .map((m) => ({ x: fmtDate(m.savedAt), y: pointWinRatePct(m.games.flatMap((g) => g.log)) }))
    .filter((p) => p.y !== null);

  return (
    <div>
      <GroupByToggle groupBy={groupBy} setGroupBy={setGroupBy} />
      {matches.length === 0 ? (
        <EmptyState text="No saved matches yet. Complete or save a match to start building history." />
      ) : (
        <>
          {trend.length >= 2 && (
            <div style={{ marginBottom: 20 }}>
              <SectionLabel>Point win % trend (all matches)</SectionLabel>
              <div style={{ borderRadius: 14, background: "white", border: "1px solid " + COLORS.line, padding: 12 }}>
                <TrendChart points={trend} color={COLORS.point} />
              </div>
            </div>
          )}
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {matches.map((m) => {
              const result = matchResult(m);
              return (
                <div key={m.id} style={{ borderRadius: 14, background: "white", border: "1px solid " + COLORS.line, padding: 12, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12 }}>
                  <button onClick={() => setSelectedMatchId(m.id)} style={{ flex: 1, textAlign: "left" }}>
                    <div style={{ fontSize: 14, fontWeight: 600 }}>{fmtDate(m.savedAt)} · {m.format === "doubles" ? "Doubles" : "Singles"} · vs {opponentDisplayName(m)}</div>
                    <div style={{ fontSize: 12, opacity: 0.6, marginTop: 2 }}>{result === "win" ? "Won" : result === "loss" ? "Lost" : "Incomplete"} · games {m.gamesWon.you}–{m.gamesWon.opp}</div>
                  </button>
                  <button onClick={() => onDeleteMatch(m.id)} style={{ padding: 8, opacity: 0.5, fontSize: 16 }}>🗑</button>
                </div>
              );
            })}
          </div>
        </>
      )}
    </div>
  );
}

function GroupByToggle({ groupBy, setGroupBy }) {
  return (
    <div style={{ display: "flex", borderRadius: 999, padding: 4, marginBottom: 16, background: COLORS.court + "1A" }}>
      <button onClick={() => setGroupBy("recent")} style={{ flex: 1, borderRadius: 999, padding: "6px 0", fontSize: 12, fontWeight: 700, background: groupBy === "recent" ? COLORS.court : "transparent", color: groupBy === "recent" ? "white" : COLORS.court }}>Recent</button>
      <button onClick={() => setGroupBy("opponent")} style={{ flex: 1, borderRadius: 999, padding: "6px 0", fontSize: 12, fontWeight: 700, background: groupBy === "opponent" ? COLORS.court : "transparent", color: groupBy === "opponent" ? "white" : COLORS.court }}>By opponent</button>
    </div>
  );
}

function BottomBar({ view, setView, onUndo, canUndo, confirmUndo, setConfirmUndo, lastEventLabel, confirmReset, setConfirmReset, onReset, hasActiveMatch }) {
  const shortLabel = lastEventLabel.length > 12 ? lastEventLabel.slice(0, 11) + "…" : lastEventLabel;
  return (
    <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, borderTop: "1px solid " + COLORS.line, background: "rgba(255,255,255,0.95)", backdropFilter: "blur(6px)", paddingBottom: "env(safe-area-inset-bottom)" }}>
      <div style={{ maxWidth: 480, margin: "0 auto", display: "flex", alignItems: "center", padding: "8px 4px" }}>
        <NavButton icon="🎯" label="Track" active={view === "track"} onClick={() => setView("track")} />
        <NavButton icon="📋" label="Log" active={view === "log"} onClick={() => setView("log")} />
        <NavButton icon="📊" label="Stats" active={view === "stats"} onClick={() => setView("stats")} />
        <NavButton icon="🕓" label="Matches" active={view === "matches"} onClick={() => setView("matches")} />

        {!confirmUndo ? (
          <button onClick={() => canUndo && setConfirmUndo(true)} disabled={!canUndo} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 2, flex: 1, padding: "6px 0", opacity: canUndo ? 1 : 0.3 }}>
            <span style={{ fontSize: 18 }}>↺</span>
            <span style={{ fontSize: 10, fontWeight: 700 }}>Undo</span>
          </button>
        ) : (
          <button onClick={onUndo} onBlur={() => setConfirmUndo(false)} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 2, flex: 1, padding: "6px 0", color: COLORS.error }}>
            <span style={{ fontSize: 18 }}>↺</span>
            <span style={{ fontSize: 9, fontWeight: 700, lineHeight: 1.1, textAlign: "center" }}>Undo "{shortLabel}"?</span>
          </button>
        )}

        {!confirmReset ? (
          <button onClick={() => setConfirmReset(true)} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 2, flex: 1, padding: "6px 0" }}>
            <span style={{ fontSize: 18 }}>⟲</span>
            <span style={{ fontSize: 10, fontWeight: 700 }}>New</span>
          </button>
        ) : (
          <button onClick={onReset} onBlur={() => setConfirmReset(false)} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 2, flex: 1, padding: "6px 0", color: COLORS.error }}>
            <span style={{ fontSize: 18 }}>⟲</span>
            <span style={{ fontSize: 9, fontWeight: 700, lineHeight: 1.1, textAlign: "center" }}>{hasActiveMatch ? "Save & new?" : "Start new?"}</span>
          </button>
        )}
      </div>
    </div>
  );
}

function NavButton({ icon, label, active, onClick }) {
  return (
    <button onClick={onClick} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 2, flex: 1, padding: "6px 0", color: active ? COLORS.court : "#9AA5A3" }}>
      <span style={{ fontSize: 16 }}>{icon}</span>
      <span style={{ fontSize: 10, fontWeight: 700 }}>{label}</span>
    </button>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
window.__pbAppRendered = true;
</script>
</body>
</html>
